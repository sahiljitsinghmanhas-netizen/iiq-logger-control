# Gates every pull request has to clear before it can be merged.
#
# What this can and cannot check, and why:
#
# The Java in this plugin compiles against identityiq.jar, which is SailPoint's
# and is not redistributable, so it cannot live in this repository and a hosted
# runner cannot fetch it. That splits the build in two. Everything that does not
# need that jar runs here on every push and pull request. The Java compile and
# the Java side of the untouchable-logger matcher run only where the jar exists
# - a self-hosted runner with IIQ_LIB set, or a maintainer's machine via
# build.bat / build.sh.
#
# That is a real gap and it is stated rather than hidden: the `java` job below
# reports plainly when it is skipped, so a green tick never quietly means less
# than it looks like it means.
#
# The page script is the part that has actually broken in the past - releases
# 2.2.0 through 2.4.0 shipped a script that never parsed, because a check
# grepped for text that was never printed instead of running the thing. Every
# gate here executes the real file.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: Page, matcher and repository gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # jjs (Nashorn) ships with JDK 11 and is what build.bat and build.sh use,
      # so CI runs the gates on exactly the engine the maintainers do. It is
      # gone from JDK 15 onwards - pinning 11 is deliberate, not stale.
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Page renders (render-check)
        run: |
          "$JAVA_HOME/bin/jjs" tools/render-check.js -- \
            ui/js/turnOnLoggers.js \
            tools/state-fixture.json \
            tools/state-fixture-logs.json

      - name: Untouchable-logger matching, page side (glob-check)
        run: |
          "$JAVA_HOME/bin/jjs" tools/glob-check.js -- ui/js/turnOnLoggers.js

      - name: Header icon behaves (nav-check)
        run: |
          "$JAVA_HOME/bin/jjs" tools/nav-check.js -- ui/js/snippets/header.js

      - name: Manifest is well-formed
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          try:
              # The DTD is generated by IdentityIQ at install time from its own
              # annotations, so it cannot be resolved here. Well-formedness is
              # what CI can prove; DTD validity is proved by installing.
              ET.parse('manifest.xml')
          except ET.ParseError as e:
              print('manifest.xml is not well-formed: %s' % e)
              sys.exit(1)
          print('manifest.xml parses')
          PY

      - name: Shipped objects are well-formed
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          bad = 0
          for f in sorted(glob.glob('import/**/*.xml', recursive=True)):
              try:
                  ET.parse(f)
                  print('  ok   %s' % f)
              except ET.ParseError as e:
                  print('  FAIL %s: %s' % (f, e)); bad = 1
          sys.exit(bad)
          PY

      # These have all drifted at least once. The help page shipped images that
      # were a release behind the README, and a section was added without a
      # table-of-contents entry.
      # A hostname invented for the screenshot cluster is not a secret, but it
      # is a name no customer should ever read in their own settings page. Two
      # of them reached shipped help text and the README before anyone noticed.
      - name: No staged demo hostnames in shipped text
        run: |
          if grep -rInE 'iiq-app-[0-9]|iiq-server-?[0-9]'                --exclude-dir=.git --exclude-dir=.github --exclude-dir=tools                --exclude='*.png' --exclude='*.mp4' --exclude='*.zip' .; then
            echo "a hostname from the demo cluster is in text that ships"
            exit 1
          fi
          echo "clean"

      - name: Documentation references resolve
        run: |
          fail=0
          for f in $(grep -o 'src="img/[^"]*"' ui/help.html | sed 's|src="img/||;s|"||' | sort -u); do
            [ -f "ui/img/$f" ] || { echo "MISSING ui/img/$f (referenced by help.html)"; fail=1; }
          done
          for f in $(grep -o '](docs/screenshots/[^)]*)' README.md | sed 's|](||;s|)||' | sort -u); do
            [ -f "$f" ] || { echo "MISSING $f (referenced by README.md)"; fail=1; }
          done
          for a in $(grep -o 'href="#[a-z][a-z-]*"' ui/help.html | sed 's|href="#||;s|"||' | sort -u); do
            grep -q "id=\"$a\"" ui/help.html || { echo "DANGLING anchor #$a in help.html"; fail=1; }
          done
          for i in $(grep -o '<h2 id="[a-z-]*"' ui/help.html | sed 's|.*id="||;s|"||'); do
            grep -q "href=\"#$i\"" ui/help.html || { echo "NO TOC ENTRY for section #$i"; fail=1; }
          done
          [ $fail -eq 0 ] && echo "all documentation references resolve"
          exit $fail

      - name: Version was bumped
        # A pull request that changes shipped code without moving the version
        # produces two different builds claiming to be the same release. That
        # has happened here before, and the zip that went out was the wrong one.
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          if git diff --quiet "origin/${{ github.base_ref }}" -- src ui manifest.xml import; then
            echo "no shipped files changed - version bump not required"
            exit 0
          fi
          before=$(git show "origin/${{ github.base_ref }}:manifest.xml" | grep -o 'version="[0-9.]*"' | head -1)
          after=$(grep -o 'version="[0-9.]*"' manifest.xml | head -1)
          echo "base: $before"
          echo "head: $after"
          if [ "$before" = "$after" ]; then
            echo "shipped files changed but manifest.xml version did not"
            exit 1
          fi
          echo "version moved"

  java:
    name: Java compile and matcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # IIQ_LIB is a repository variable, not a secret - it is a path on a
      # self-hosted runner. On hosted runners it is unset and this job says so.
      - name: Compile and run GlobTest
        env:
          IIQ_LIB: ${{ vars.IIQ_LIB }}
        run: |
          if [ -z "$IIQ_LIB" ] || [ ! -f "$IIQ_LIB/identityiq.jar" ]; then
            echo "SKIPPED: identityiq.jar is not available on this runner."
            echo
            echo "It is SailPoint's and cannot be redistributed, so it is not in"
            echo "this repository and a hosted runner cannot fetch it. The Java"
            echo "compile and the Java side of the untouchable-logger matcher"
            echo "therefore run only where the jar exists:"
            echo
            echo "  - a self-hosted runner with the IIQ_LIB repository variable"
            echo "    pointing at <identityiq>/WEB-INF/lib"
            echo "  - a maintainer running build.bat or build.sh before release"
            echo
            echo "The page side of the same matcher IS covered here, by"
            echo "glob-check.js in the gates job, so a change that makes the two"
            echo "disagree is still caught."
            exit 0
          fi
          mkdir -p build/classes
          find src -name '*.java' > build/sources.txt
          javac -source 11 -target 11 -encoding UTF-8 -nowarn \
                -cp "$IIQ_LIB/*" -d build/classes @build/sources.txt
          javac -nowarn -cp "build/classes:$IIQ_LIB/*" -d build tools/GlobTest.java
          java -cp "build:build/classes:$IIQ_LIB/*" GlobTest
